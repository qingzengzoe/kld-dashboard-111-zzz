<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif;background:#1B2333;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column}
h2{font-size:22px;margin-bottom:8px} p{font-size:13px;color:#98A2B3;margin-bottom:24px}
input{border:none;border-radius:10px;padding:12px 16px;font-size:16px;width:260px;outline:none;text-align:center}
.err{font-size:12px;color:#E5484D;margin-top:10px;display:none}

.pw-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#1B2333;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Noto Sans CJK SC","PingFang SC",sans-serif}
.pw-box{background:#fff;border-radius:16px;padding:40px 48px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.pw-box h2{font-size:22px;color:#1B2333;margin-bottom:8px}
.pw-box p{font-size:13px;color:#7A8699;margin-bottom:24px}
.pw-box input{border:2px solid #DCE3EF;border-radius:10px;padding:12px 16px;font-size:16px;width:260px;outline:none;text-align:center;font-family:inherit}
.pw-box input:focus{border-color:#5B8DEF}
.pw-err{font-size:12px;color:#E5484D;margin-top:10px;display:none}

</style></head><body>

<div class="pw-overlay" id="pwgate">
  <div class="pw-box">
    <h2>Kalodata 广告看板</h2>
    <p>输入密码查看</p>
    <input type="password" id="pwinp" placeholder="请输入密码" autofocus>
    <div class="pw-err" id="pwerr">密码错误</div>
  </div>
</div>


<script>
var PW_HASH = "26979624ac0b501a345098cc690453fd3b9e0af4d770ee757330394861fbed51";
document.getElementById('pwinp').addEventListener('keydown', async function(e){
  if(e.key !== 'Enter') return;
  var input = e.target.value;
  var hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
  var hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  if(hex === PW_HASH){ document.getElementById('pwgate').style.display = 'none'; }
  else{ document.getElementById('pwerr').style.display = 'block'; e.target.value = ''; }
});
</script>

document.getElementById('pi').addEventListener('keydown', async function(e){
  if(e.key!=='Enter') return;
  try{
    var raw=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));
    var salt=raw.slice(0,16),iv=raw.slice(16,28),tag=raw.slice(28,44),ct=raw.slice(44);
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(e.target.value),'PBKDF2',false,['deriveBits']);
    var kb=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},km,256));
    var key=await crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['decrypt']);
    var buf=new Uint8Array(ct.length+tag.length); buf.set(ct); buf.set(tag,ct.length);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv,tagLength:128},key,buf);
    document.documentElement.innerHTML=new TextDecoder().decode(pt);
  }catch(err){document.getElementById('pe').style.display='block';}
});
